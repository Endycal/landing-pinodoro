# Ogni mattina (05:23 UTC = 7:23 ora italiana d'estate, 6:23 d'inverno) scarica le recensioni della scheda Google
# (Places API) e ripubblica la pagina con il file aggiornato. recensioni.json non entra mai nel repository.
# Si può lanciare a mano da Actions > "Aggiorna le recensioni Google". Servono il secret GOOGLE_PLACES_API_KEY
# e, facoltativa, la variabile GOOGLE_PLACE_ID (altrimenti vale quello di data/restaurant.json).
name: Aggiorna le recensioni Google

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna-e-pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica le recensioni dalla scheda Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: node scripts/aggiorna-recensioni.mjs
      - name: Costruisci il sito
        run: node scripts/costruisci.mjs
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica i file
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4

  hostinger:
    # Facoltativo: carica le recensioni aggiornate (e il resto) anche su Hostinger via FTP.
    # Parte solo se sono impostati HOSTINGER_FTP_HOST e i secret HOSTINGER_FTP_USER / HOSTINGER_FTP_PASSWORD.
    if: vars.HOSTINGER_FTP_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scarica le recensioni dalla scheda Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
        run: node scripts/aggiorna-recensioni.mjs
      - name: Costruisci il sito per Hostinger
        run: node scripts/costruisci.mjs --hostinger
      - name: Carica su Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
          local-dir: _sito/
          server-dir: ${{ vars.HOSTINGER_FTP_DIR || 'public_html/' }}
          exclude: |
            config.php
